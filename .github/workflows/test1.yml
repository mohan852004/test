name: run Helloworld py script
on: push
jobs:
  test1:
    runs-on: ubuntu-latest

    steps:
    - name: clone repo
      uses: actions/checkout@v3

    - name: setup python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: run a py script
      run: python hello.py

      
